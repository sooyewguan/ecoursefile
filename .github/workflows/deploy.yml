name: Deploy to Firebase Hosting

# Runs only when someone starts it from the Actions tab, so nothing goes live
# before the production Supabase project exists (sooyewguan/ecoursefile#24).
on:
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The production environment holds the deploy secrets and, with a required
    # reviewer set, waits for approval before the job starts.
    environment:
      name: production
      url: https://e-coursefile.web.app
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_E_COURSEFILE }}
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY FIREBASE_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set in the production environment. See 'Deploy to Firebase Hosting' in README.md."
              missing=1
            fi
          done
          case "$VITE_SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::VITE_SUPABASE_URL must be the https URL of the hosted Supabase project."; missing=1 ;;
          esac
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check and build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy to the live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_E_COURSEFILE }}
          projectId: e-coursefile
          channelId: live
